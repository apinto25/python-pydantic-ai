[project]
name = "recipe-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ana Pinto", email = "anapinto2503@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "logfire>=5.1.1",
    "pydantic-ai>=2.51.0",
    "pydantic-evals>=2.51.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
recipe-assistant = "recipe_assistant:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
